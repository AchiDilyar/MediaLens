name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Core checks
        run: swift run MediaLensChecks
      - name: Install fixture generator
        run: brew install ffmpeg
      - name: Media integration checks
        run: bash scripts/smoke-test.sh
      - name: Native App build
        env:
          APP_ARCHS: ${{ matrix.arch }}
        run: bash scripts/build-app.sh
      - name: Verify native bundled engine
        run: bash scripts/check-bundled-engine.sh
      - name: Build universal DMG
        if: matrix.arch == 'arm64'
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: MediaLens-universal-DMG
          path: |
            dist/MediaLens.dmg
            dist/MediaLens.dmg.sha256
          if-no-files-found: error
          retention-days: 14
