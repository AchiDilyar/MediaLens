<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="194" viewBox="0 0 1200 194" role="img" aria-labelledby="title">
<title id="title">拖入即读、细节可查、报告可分享</title><rect width="1200" height="194" rx="18" fill="#f4f7fb"/>
<g stroke="#dbe3ee"><path d="M400 32V162M800 32V162"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
<g transform="translate(34 30)"><text y="24" font-size="13" font-weight="700" fill="#007fb9">01 / DROP</text><text y="67" font-size="23" font-weight="600" fill="#14243b">拖入，即刻看清</text><text y="100" font-size="15" fill="#586b85">批量检查 · 原生缩略图 · 真实文件拖出</text><text y="128" font-size="13" fill="#7b8ba0">从访达服务打开，融入你的工作流。</text></g>
<g transform="translate(434 30)"><text y="24" font-size="13" font-weight="700" fill="#588300">02 / INSPECT</text><text y="67" font-size="23" font-weight="600" fill="#14243b">参数，一目了然</text><text y="100" font-size="15" fill="#586b85">容器 · 编码 · 视频 · 音频 · 字幕</text><text y="128" font-size="13" fill="#7b8ba0">紧凑概览，搜索每一项属性与标签。</text></g>
<g transform="translate(834 30)"><text y="24" font-size="13" font-weight="700" fill="#c65027">03 / EXPORT</text><text y="67" font-size="23" font-weight="600" fill="#14243b">结果，随手分享</text><text y="100" font-size="15" fill="#586b85">复制文本 · 导出报告 · 导出 JSON</text><text y="128" font-size="13" fill="#7b8ba0">内置检测引擎，文件始终留在本机。</text></g></g></svg>
